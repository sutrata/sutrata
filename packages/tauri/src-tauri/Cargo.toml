[package]
name = "sutrata"
version = "0.1.0"
edition = "2021"
authors = ["Sivaraj D"]
description = "Tauri backend for Sutrata screenplay editor"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"

# Native PDF export on Windows: calls WebView2's PrintToPdf directly so the
# PDF is generated by the browser engine's own renderer (real vector text,
# embedded fonts) instead of going through the OS print spooler/driver.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[lib]
name = "sutrata_lib"
path = "src/lib.rs"
