name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sutra/parser test
      - run: pnpm --filter @sutra/parser build

  editor:
    name: Editor tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sutra/parser build
      - run: pnpm --filter @sutrata/editor test
      - run: pnpm --filter @sutrata/editor build

  app-build:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sutra/parser build
      - run: pnpm --filter @sutrata/editor build
      - run: pnpm --filter @sutrata/app build



  tofu-gate:
    name: Font coverage (tofu gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install canvas
      - run: node scripts/check-tofu.js
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fonttools brotli
      - run: python scripts/check-font-coverage.py
