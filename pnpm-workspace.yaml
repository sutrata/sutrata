  - undici@7.28.0 || 7.29.0 || 7.29.1
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 1.1.19 || 1.1.20 || 1.1.21 || 2.1.2 || 2.1.3 || 2.1.4 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.7 || 5.0.8 || 5.0.9 || 5.0.10 || 5.0.11 || 5.0.12
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5 || 3.1.6 || 3.1.7 || 3.1.8
  - postcss@8.5.18 || 8.5.23
