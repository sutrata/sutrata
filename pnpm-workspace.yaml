  nanoid@<3.3.18: '>=3.3.18'
  brace-expansion@2: '>=2.1.6'
  'brace-expansion@>=3': '>=5.0.12'
  'vite@<6.4.3': '^6.4.3'
  fast-uri: '>=3.1.7'
  browserslist: '>=4.28.7'
  tinypool: '>=2.1.2'
