packages:
  - 'packages/*'
allowBuilds:
  canvas: false
  esbuild: true
nodeLinker: hoisted
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - nanoid@3.3.8 || 3.3.12 || 3.3.16 || 3.3.18 || 5.1.16
  - tar@7.5.3 || 7.5.4 || 7.5.7 || 7.5.8 || 7.5.10 || 7.5.11 || 7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
